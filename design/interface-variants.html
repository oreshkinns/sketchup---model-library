const descriptions={1:'<b>1. Компактный · рекомендую.</b> Привычная навигация, три колонки моделей,<br>поиск и добавление всегда под рукой.',2:'<b>2. Галерея.</b> Верхние вкладки освобождают ширину.<br>Четыре колонки для быстрого визуального выбора.',3:'<b>3. Рабочий.</b> Плотный список слева, параметры и размещение справа.<br>Для работы с большой библиотекой.'};
function render(){document.querySelector('.window').className=`window v${variant}`;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.variant)===variant));document.querySelector('#description').innerHTML=descriptions[variant];document.querySelector('#window-logo').innerHTML=icon('box',16);
document.querySelector('#root').innerHTML=`<aside class="sidebar">${brand()}${nav()}<div class="side-bottom"><button data-demo="Настройки">Настройки</button><small>SketchUp · локально</small></div></aside><main class="workspace"><div class="topnav">${brand()}${nav()}<button class="utility" data-demo="Настройки" aria-label="Настройки">${icon('settings')}</button></div><header class="header"><div><div class="title-line"><h2>Библиотека</h2><span>8 моделей</span></div><p>Модели для вашего проекта SketchUp</p></div><div class="actions"><button class="analysis" data-demo="Анализ проекта">Анализировать</button><details class="add-menu"><summary>＋ Добавить</summary><div class="popover"><button data-demo="Добавление выделенного">Выделенное в SketchUp</button><button data-demo="Добавление файла .skp">Файл .skp</button><button data-demo="Создание копии">Копию выделенного</button><small>Место сохранения: личная библиотека</small></div></details></div></header><div class="tools"><label class="search">${icon('search',16)}<input type="search" aria-label="Поиск моделей" placeholder="Найти модель или #тег" value="${query}"></label><select class="category" aria-label="Раздел"><option value="">Все разделы</option>${[...new Set(models.map(m=>m.category))].map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select><select class="scope" aria-label="Библиотека"><option value="">Все библиотеки</option>${['Личная','Общая','Облако'].map(c=>`<option ${c===scope?'selected':''}>${c}</option>`).join('')}</select><details class="add-menu"><summary style="padding:8px;background:white;color:var(--ink);border-color:var(--line)" aria-label="Другие действия">${icon('more',16)}</summary><div class="popover"><button data-demo="Проверка папки">Проверить папку</button><button data-demo="Экспорт подборки">Экспорт видимых</button><button data-demo="Импорт подборки">Импорт подборки</button><button data-demo="Замена выделенных">Заменить выделенные</button><button data-demo="Переключение темы">Сменить тему</button></div></details></div><div class="subbar"><button data-mode="all">Все модели</button><button data-mode="favorites">Избранное</button><span class="result"></span></div><div class="collection"><div class="cards"></div><aside class="inspector" aria-label="Выбранная модель"></aside></div><footer class="footer"><i class="dot"></i><span>Локальная библиотека</span><span>Анализ ещё не запускался</span></footer></main>`;renderCards();}
function renderCards(){const visible=models.map((m,i)=>({...m,i})).filter(m=>(!query||(m.name+' '+m.category).toLowerCase().includes(query.toLowerCase().replace('#','')))&&(!category||m.category===category)&&(!scope||m.scope===scope)&&(mode!=='favorites'||m.fav));document.querySelector('.result').textContent=`${visible.length} из ${models.length}`;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)});document.querySelector('.cards').innerHTML=visible.length?visible.map(m=>`<button class="card ${m.i===selected?'selected':''}" data-select="${m.i}" aria-pressed="${m.i===selected}" aria-label="Выбрать: ${m.name}"><div class="art">${art(m.type)}${m.fav?'<span class="star" aria-label="В избранном">☆</span>':''}</div><div class="card-copy"><h3>${m.name}</h3><p>${m.category} · ${m.scope}</p><div class="card-foot"><span>${m.count?'В проекте: '+m.count:'Не размещена'}</span><span class="place">Подробнее →</span></div></div></button>`).join(''):'<p class="empty">Ничего не найдено.<br>Измените запрос или фильтры.</p>';renderInspector();}
function renderInspector(){const m=models[selected];document.querySelector('.inspector').innerHTML=`<div class="big-art">${art(m.type)}</div><div><h3>${m.name}</h3><p>${m.category} · ${m.scope} библиотека</p></div><dl class="specs"><dt>Габариты, мм</dt><dd>${m.size}</dd><dt>Файл SketchUp</dt><dd>${m.file}</dd><dt>В проекте</dt><dd>${m.count} шт.</dd></dl><div class="actions"><button class="primary" data-demo="Размещение модели">Разместить в проекте</button><button data-demo="Массив по линии">По линии</button><button data-demo="Массив по поверхности">По поверхности</button></div><small>Свойства демонстрационной модели</small>`;}
let timer;function notice(message){document.querySelector('.notice').textContent=message;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('.notice').textContent='',4200)}
document.addEventListener('click',e=>{const v=e.target.closest('[data-variant]'),c=e.target.closest('[data-select]'),tab=e.target.closest('[data-mode]'),demo=e.target.closest('[data-demo]');if(v){variant=Number(v.dataset.variant);render();history.replaceState(null,'',`?variant=${variant}${document.documentElement.classList.contains('embed')?'&embed=1':''}`)}if(c){selected=Number(c.dataset.select);renderCards();if(variant!==3)notice(`${models[selected].name} — в рабочем варианте параметры показаны справа.`)}if(tab){mode=tab.dataset.mode;renderCards()}if(demo){notice(`Макет: «${demo.dataset.demo}» подключается к SketchUp при внедрении.`);document.querySelectorAll('details[open]').forEach(d=>d.open=false)}});
document.addEventListener('input',e=>{if(e.target.matches('input[type=search]')){query=e.target.value;renderCards()}});document.addEventListener('change',e=>{if(e.target.matches('.category')){category=e.target.value;renderCards()}if(e.target.matches('.scope')){scope=e.target.value;renderCards()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('details[open]').forEach(d=>d.open=false);document.querySelector('.notice').textContent=''}});render();
</script>
</html>
