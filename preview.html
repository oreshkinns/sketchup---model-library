:root[data-theme="light"] {
  --bg: #edf1f2;
  --panel: #fff;
  --ink: #1c303b;
  --muted: #637782;
  --line: #d4dfe2;
  --accent: #116b75;
  --accent-ink: #fff;
  --soft: #e8f4f2;
  --selected: #d5eceb;
  --warn: #ad6422;
  --warn-soft: #fff2e5;
  --danger: #9e4141;
  --shadow: 0 12px 36px rgba(28, 48, 59, 0.08);
}
:root[data-theme="dark"] {
  --bg: #14232b;
  --panel: #1d303a;
  --ink: #e9f0f1;
  --muted: #a7bac1;
  --line: #3a5059;
  --accent: #69bec0;
  --accent-ink: #10252c;
  --soft: #25484c;
  --selected: #315f62;
  --warn: #edb577;

* {
  box-sizing: border-box;
}
html {
  font-family: "Trebuchet MS", Arial, sans-serif;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
tr:focus-visible,
[contenteditable]:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 21px;
  line-height: 1.15;
  letter-spacing: -0.04em;
}
h2 {
  font-size: 18px;
  letter-spacing: -0.025em;
}
h3 {
  font-size: 14px;
}
small,
.muted {
  color: var(--muted);
}
.mono {
  font-family: Consolas, Monaco, monospace;
  font-variant-numeric: tabular-nums;
}
.app {
  max-width: 1440px;
  margin: auto;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 206px minmax(0, 1fr);
}
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 24px 14px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border: 2px solid var(--accent);
  display: grid;
  place-items: center;
  color: var(--accent);
  font-weight: 900;
  font-size: 16px;
  letter-spacing: -0.1em;
  transform: rotate(-2deg);
}
.brand small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.nav {
  display: grid;
  gap: 4px;
}
.nav button {
  border: 0;
  background: transparent;
  color: var(--muted);
  text-align: left;
  padding: 10px 11px;
  border-radius: 7px;
  font-weight: 700;
  display: flex;
  gap: 9px;
  align-items: center;
  min-height: 40px;
}
.nav button:hover,
.nav button.active {
  background: var(--soft);
  color: var(--accent);
}
.nav .num {
  margin-left: auto;
  font:
    700 11px Consolas,
    monospace;
}
.side-note {
  margin-top: auto;
  padding: 14px 12px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}
.shared-library-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.shared-library-info > div {
  min-width: 0;
}
.shared-library-info .button {
  flex: none;
}
.catalog-list > .empty {
  grid-column: 1/-1;
}
.catalog-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 5px;
}
.catalog-tags {
  color: var(--accent);
  font-size: 11px;
  margin-top: 5px;
}
.catalog-more summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 11px;
  padding: 5px 0;
}
.catalog-more .row-actions {
  padding-top: 7px;
}
.main {
  min-width: 0;
  padding: 26px clamp(18px, 3vw, 38px) 32px;
}
.top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.eyebrow {
  font:
    700 10px Consolas,
    monospace;
  letter-spacing: 0.16em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 7px;
}
.top-actions,
.toolbar,
.row-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.button {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 6px;
  padding: 9px 13px;
  font-weight: 700;
  min-height: 37px;
}
.button:hover {
  border-color: var(--accent);
}
.button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.button.ghost {
  background: transparent;
}
.button.small {
  padding: 6px 9px;
  min-height: 31px;
  font-size: 12px;
}
.button.danger {
  color: var(--danger);
}
.status {
  min-height: 32px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 5px;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 16px;
}
.status.success {
  border-color: var(--accent);
  color: var(--accent);
}
.status.error {
  border-color: var(--danger);
  color: var(--danger);
}
.page {
  display: none;
}
.page.active {
  display: block;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.metric {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 15px 16px;
  border-radius: 7px;
  min-height: 91px;
}
.metric b {
  display: block;
  font:
    700 28px Consolas,
    monospace;
  letter-spacing: -0.06em;
  line-height: 1.15;
  margin: 8px 0 2px;
}
.metric span {
  color: var(--muted);
  font-size: 11px;
}
.metric.warning {
  background: var(--warn-soft);
  border-color: var(--warn);
}
.metric.warning b {
  color: var(--warn);
}
.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.75fr) minmax(245px, 0.7fr);
  gap: 16px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.panel-head {
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-body {
  padding: 16px 18px;
}
.hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.table-wrap {
  overflow-x: auto;
}
.table {
  width: 100%;
  border-collapse: collapse;
  min-width: 550px;
}
.table th {
  text-align: left;
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.table tr:last-child td {
  border-bottom: 0;
}
.model-row {
  cursor: pointer;
}
.model-row:hover {
  background: var(--soft);
}
.model-row[aria-selected="true"] {
  background: var(--selected);
  box-shadow: inset 4px 0 var(--accent);
}
.model-name {
  font-weight: 700;
}
.sub {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 7px;
  border-radius: 4px;
  background: var(--soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.badge.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.empty {
  padding: 30px;
  text-align: center;
  color: var(--muted);
}
.selection-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 9px 15px;
  border-bottom: 1px solid var(--line);
  background: var(--soft);
}
.selection-bar[hidden] {
  display: none;
}
.selection-bar strong {
  color: var(--accent);
}
.selection-bar .button {
  background: var(--panel);
}
.filter,
.field input,
.field select {
  padding: 9px 11px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 6px;
}
.filter {
  width: 100%;
  max-width: 300px;
}
.field {
  display: grid;
  gap: 6px;
}
.field label {
  font-weight: 700;
  font-size: 12px;
}
.field input,
.field select {
  width: 100%;
}
.duplicate {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 9px;
}
.duplicate:last-child {
  border: 0;
}
.duplicate-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
}
.duplicate p {
  font-size: 12px;
  color: var(--muted);
}
.insight {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
}
.insight-mark {
  font:
    700 22px Consolas,
    monospace;
  color: var(--accent);
}
.section-gap {
  display: grid;
  gap: 16px;
}
.callout {
  padding: 12px;
  background: var(--soft);
  border-radius: 5px;
  font-size: 12px;
  line-height: 1.55;
}
.pill-row {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.pill {
  padding: 5px 8px;
  border-radius: 4px;
  background: var(--soft);
  font-size: 11px;
  color: var(--accent);
}
.duplicate-choice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.duplicate-choice:has(input:checked) {
  background: var(--selected);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.duplicate-choice input {
  accent-color: var(--accent);
}
.analysis-time {
  font:
    12px Consolas,
    monospace;
  color: var(--muted);
  white-space: nowrap;
}
.catalog-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 16px;
}
.catalog-card {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px;
  display: grid;
  gap: 9px;
  min-width: 0;
}
.catalog-art {
  height: 132px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 19px,
      var(--line) 20px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 19px,
      var(--line) 20px
    );
  display: grid;
  place-items: center;
  border-radius: 4px;
  overflow: hidden;
  color: var(--accent);
  font-size: 40px;
  font-weight: 700;
}
.catalog-art img {
  display: block;
  min-width: 0;
  min-height: 0;
  width: 100%;
  height: 132px;
  object-fit: contain;
  background: var(--panel);
}
.catalog-meta {
  font-size: 11px;
  color: var(--muted);
}
.catalog-card h3 {
  overflow-wrap: anywhere;
}
.catalog-card .row-actions {
  align-self: end;
}
.catalog-card .row-actions .button {
  font-size: 11px;
}
.scope-tag {
  font:
    700 10px Consolas,
    monospace;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.list {
  display: grid;
}
.list-item {
  border-bottom: 1px solid var(--line);
  padding: 15px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.list-item:last-child {
  border: 0;
}
.list-item button {
  text-align: left;
}
.setting-row {
  padding: 17px 18px;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 10px;
}
.setting-row:last-child {
  border: 0;
}
.path {
  font:
    12px Consolas,
    monospace;
  overflow-wrap: anywhere;
  color: var(--muted);
}
.setting-row .row-actions {
  justify-content: flex-start;
}
.row-actions[hidden] {
  display: none;
}
.context-menu {
  position: fixed;
  z-index: 20;
  display: none;
  min-width: 210px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.2);
  padding: 5px;
}
.context-menu.open {
  display: grid;
}
.context-menu button {
  border: 0;
  background: transparent;
  text-align: left;
  color: var(--ink);
  padding: 9px 12px;
  border-radius: 5px;
  min-height: 35px;
}
.context-menu button:hover:not(:disabled),
.context-menu button:focus-visible {
  background: var(--soft);
  color: var(--accent);
}
.context-menu button.danger {
  color: var(--danger);
}
.context-menu .rule {
  height: 1px;
  background: var(--line);
  margin: 4px 0;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(9, 25, 31, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 30;
}
.modal-backdrop.open {
  display: flex;
}
.modal {
  width: min(100%, 490px);
  background: var(--panel);
  color: var(--ink);
  border-radius: 9px;
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.25);
  padding: 22px;
  display: grid;
  gap: 16px;
}
.modal h2 {
  font-size: 20px;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.paste-zone {
  padding: 24px;
  border: 2px dashed var(--accent);
  border-radius: 7px;
  background: var(--soft);
  min-height: 100px;
  outline: 0;
}
.paste-zone:empty:before {
  content: "Нажмите Ctrl+V или Cmd+V для вставки изображения";
  color: var(--muted);
}
.field[hidden],
.callout[hidden] {
  display: none;
}
@media (max-width: 1050px) {
  .content-grid {
    grid-template-columns: 1fr;
  }
  .catalog-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 700px) {
  .app {
    display: block;
  }
  .sidebar {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 9px 12px;
    gap: 0;
  }
  .brand,
  .side-note {
    display: none;
  }
  .nav {
    display: flex;
    overflow: auto;
  }
  .nav button {
    white-space: nowrap;
    padding: 8px 9px;
  }
  .main {
    padding: 17px 13px;
  }
  .top {
    display: block;
  }
  .top-actions {
    margin-top: 14px;
  }
  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .catalog-list {
    grid-template-columns: 1fr;
  }
  .panel-head {
    align-items: flex-start;
    flex-direction: column;
  }
}
@media (prefers-reduced-motion: no-preference) {
  button {
    transition:
      background-color 0.15s,
      border-color 0.15s,
      transform 0.15s;
  }
  button:active {
    transform: translateY(1px);
  }
}
[hidden] {
  display: none !important;
}
.metric p {
  font:
    700 17px Consolas,
    monospace;
  margin: 12px 0;
}
.tree-label {
  display: flex;
  align-items: center;
  gap: 7px;
}
.tree-toggle {
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  color: var(--ink);
  width: 27px;
  min-width: 27px;
  height: 27px;
}
.tree-spacer {
  display: inline-block;
  min-width: 27px;
}
.tree-container {
  background: var(--bg);
}
.maf-filter {
  white-space: nowrap;
  font-size: 12px;
}
.candidate-panel {
  margin-top: 18px;
}
.recognition-item {
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}
.recognition-item summary {
  cursor: pointer;
  font-weight: 700;
}
.recognition-item .hint {
  margin: 8px 0;
}
.parameters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
  font-size: 12px;
}
.parameters div {
  overflow-wrap: anywhere;
}
.checksum {
  overflow-wrap: anywhere;
}
.catalog-card:focus {
  outline: 3px solid var(--accent);
}
.catalog-warning {
  color: var(--warn);
  font-size: 12px;
}
.modal {
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.modal-body {
  min-height: 0;
  overflow: auto;
  display: grid;
  gap: 16px;
  overflow-wrap: anywhere;
}
.modal-actions {
  flex-shrink: 0;
}
.modal-status {
  font-size: 12px;
  color: var(--danger);
  margin-bottom: 8px;
}
.preview-details {
  margin-top: 8px;
}
.preview-details summary {
  cursor: pointer;
}
.preview-details ul {
  padding-left: 20px;
  margin: 8px 0;
}
.preview-blocker {
  margin-top: 8px;
}
#action-scope {
  white-space: pre-wrap;
  max-height: 180px;
  overflow: auto;
}
.recognition-item .row-actions {
  margin-top: 12px;
}
.sync-error {
  color: var(--danger);

/* Gallery layout: compact top navigation, four columns in the default dialog. */
:root,
:root[data-theme="light"] {
  --bg: #fff;
  --panel: #fff;
  --ink: #2c3336;
  --muted: #626d70;
  --line: #e3e7e6;
  --accent: #343e40;
  --accent-ink: #fff;
  --soft: #f3f5f4;
  --selected: #e8efeb;
  --shadow: none;
}
@media (prefers-color-scheme: dark) {

    --bg: #1b2022;

    --muted: #aab5af;
    --line: #3b4441;

    --accent-ink: #202a24;
    --soft: #2b3430;
    --selected: #35483f;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2022;
  --panel: #22282a;
  --ink: #ecf0ee;
  --muted: #aab5af;
  --line: #3b4441;
  --accent: #bed2c7;
  --accent-ink: #202a24;

  --selected: #35483f;
  --shadow: none;

}
body {

}
.app {

  flex-direction: column;
}
.sidebar {
